name: CI - AI Legal Assistant

on:
  push:
    branches: [main, week_4, week_5, week_6, week_7, week_8]
  pull_request:
    branches: [main, week_4, week_5, week_6, week_7, week_8]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('configs/environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-asyncio
          pip install black isort pylint flake8
          pip install fastapi uvicorn requests beautifulsoup4 lxml
          pip install sentence-transformers transformers torch
          pip install python-dotenv aiohttp pandas numpy pydantic
          pip install google-generativeai chromadb

      - name: Create required directories
        run: |
          mkdir -p data/processed/texts
          mkdir -p data/processed/chunks
          mkdir -p data/processed/vector_store
          mkdir -p logs

      - name: Run Linting - Flake8
        run: |
          flake8 src/ app/ tests/ --max-line-length=880 --ignore=E203,W503
        continue-on-error: true

      - name: Run Linting - Black (Check formatting)
        run: |
          black --check src/ app/ tests/ --line-length=880
        continue-on-error: true

      - name: Run Linting - isort (Check imports)
        run: |
          isort --check-only src/ app/ tests/ --profile black
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run Tests with Coverage
        run: |
          pytest tests/ --cov=src --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

      - name: Test FastAPI app startup
        run: |
          timeout 30s uvicorn app.retrieve:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -f http://127.0.0.1:8000/ || exit 1
          pkill -f uvicorn
        continue-on-error: true

      - name: Install Newman for API testing
        run: |
          npm install -g newman
        continue-on-error: true

      - name: Run Postman tests with Newman
        run: |
          # Start server in background
          timeout 60s uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          # Wait for server to start
          sleep 10

          # Check if server is running and run Newman tests
          if curl -f http://127.0.0.1:8000/ > /dev/null 2>&1; then
            echo "Server is running, starting Newman tests..."
            bash run_newman.sh
          else
            echo "Server failed to start, skipping Newman tests"
          fi

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          pkill -f uvicorn || true
        continue-on-error: true