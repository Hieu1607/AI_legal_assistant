version: '3.8'

services:
  ai-legal-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
      - ENV=production
    volumes:
      # Named volumes for production
      - ai-legal-data:/app/data
      - ai-legal-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ai-legal-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

networks:
  ai-legal-network:
    driver: bridge

volumes:
  ai-legal-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/ai-legal-assistant/data
  ai-legal-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/ai-legal-assistant/logs
